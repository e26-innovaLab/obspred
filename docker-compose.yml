services:
  db:
    image: postgres:16-alpine
    container_name: obspred-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: obspred_db
    ports:
      - "5432:5432"
    volumes:
      - obspred_pgdata:/var/lib/postgresql/data
volumes:
  obspred_pgdata: